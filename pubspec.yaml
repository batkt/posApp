name: posease
description: A beautiful mobile POS application

publish_to: "none"

version: 1.0.19+17

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  intl: ^0.20.2
  flutter_svg: ^2.0.7
  google_fonts: ^6.1.0
  http: ^1.2.0
  share_plus: ^12.0.2
  pdf: ^3.12.0
  printing: ^5.14.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1
  pax_sdk: ^1.0.4
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.0
  socket_io_client: ^3.1.3
  record: ^6.1.1
  audioplayers: ^6.0.0
  image_picker: ^1.1.2
  path_provider: ^2.1.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  flutter_blue_plus: ^1.32.0
  image: ^4.2.0
  flutter_background_service: ^5.1.0
  android_intent_plus: ^6.1.0
  permission_handler: 11.4.0
  shared_preferences: ^2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/poslogo.png
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/images/poslogo.png
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: assets/images/poslogo.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/images/poslogo.png
